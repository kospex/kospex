[build-system]
requires = ["setuptools>=78.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kospex"
version = "0.1.1"
description = "kospex - Code and Developer Analytics."
authors = [{ name = "Peter Freiberg", email = "peter@kospex.io" }]
license = "MIT"
license-files = ["LICENSE"]

dependencies = [
    "click>=8.4.1,<9",
    # This was for a PoC, being further researched for feasibility and usefulness.
    # "duckdb>=1.5.6,<2",
    "prettytable>=3.17.0,<4",
    "python-dateutil>=2.9",
    # Uncapped: nearly every environment shares packaging, so a cap causes
    # resolver conflicts. kospex only uses Requirement and Version.
    "packaging>=26.1",
    "panopticas>=0.0.21",
    # >=1.2.2 clears GHSA-mf9w-mj56-hr94 (set_key follows symlinks). kospex
    # only calls load_dotenv, but shouldn't allow a version its own sca flags.
    "python-dotenv>=1.2.2,<2",
    # >=4.1.1 for Database.atomic(): save_dependencies() needs an explicit
    # BEGIN to roll a failed upsert back. sqlite3's `with conn:` does not
    # work here. Matches the pin already in requirements.txt.
    # != 4.2: that release crashes on import (missing typing_extensions),
    # fixed in 4.2.1.
    "sqlite-utils>=4.1.1,!=4.2,<5",
    # >=2.34.0: no_proxy no longer matches greedily, which matters behind
    # corporate proxies. 2.34's other changes are type hints only.
    "requests>=2.34.0,<3",
    # Transitive via requests, listed so upgrading kospex also upgrades an
    # older certifi already installed. >=2026.10.19 drops the emSign roots
    # whose intermediate CA keys were compromised (GHSA-6q48-6c7w-9gw2).
    # Uncapped: calendar-versioned, and a cap would freeze the trust store.
    "certifi>=2026.10.19",
    "rich>=14.3.3,<16",
    # >=0.0.31 clears the GHSAs fixed in 0.0.22-0.0.31 (multipart parsing
    # DoS, parameter smuggling); reachable via /package-check/upload.
    "python-multipart>=0.0.31,<0.1",
    "PyYAML>=6.0.3,<7",
    "jinja2>=3.1.6",
    # Capped: FastAPI 0.x ships breaking changes in minors. 0.147-0.149 all
    # landed on 2026-10-19 and change form and parameter-default handling.
    "fastapi>=0.140.0,<0.147",
    # 0.50 changed the exit code for startup failures (e.g. port in use) to 3.
    "uvicorn>=0.52.0,<0.55",
]

requires-python = ">=3.12"
readme = "README.short.md"
keywords = ["analytics", "git", "code analytics", "developer analytics", "open source inventory", "predictive maintenance"]
classifiers = ["Programming Language :: Python :: 3"]


[tool.setuptools]
include-package-data = true
# Flat top-level modules in src/ that are not part of the `kospex` package.
# These ship the CLI entry points (kospex_cli, kgit, kreaper, kweb2, etc.) and
# must be listed explicitly because configuring `packages.find` disables
# setuptools' auto-discovery of py-modules.
py-modules = [
    "api_routes",
    "kgit",
    "kospex_agent",
    "kospex_bitbucket",
    "kospex_cli",
    "kospex_core",
    "kospex_dependencies",
    "kospex_email",
    "kospex_git",
    "kospex_github",
    "kospex_logging",
    "kospex_observation",
    "kospex_query",
    "kospex_request_cache",
    "kospex_schema",
    "kospex_stats",
    "kospex_utils",
    "kospex_web",
    "kreaper",
    "krunner",
    "krunner_utils",
    "kweb_graph_service",
    "kweb_help_service",
    "kweb_security",
    "kweb2",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
"*" = [
    "templates/*.html",
    "templates/**/*.html",
    "static/**/*"
]
"kospex.db.migrations" = ["*.sql", "*.py", "README.md"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["kospex*", "templates*", "static*"]
namespaces = true

[project.optional-dependencies]
test = [
    # >=9.1: caplog captures non-propagating loggers from 9.1 (pytest#3697).
    # get_kospex_logger() sets propagate=False, so caplog tests need it.
    "pytest>=9.1,<10",
    "httpx>=0.28.1,<1",
]

[project.scripts]
kgit = "kgit:cli"
kospex = "kospex_cli:cli"
kospex-agent = "kospex_agent:cli"
krunner = "krunner:cli"
kreaper = "kreaper:cli"
kweb = "kweb2:main"


[project.urls]
Homepage = "https://kospex.io"
Issues = "https://github.com/kospex/kospex/issues"
Repository = "https://github.com/kospex/kospex"
Changelog = "https://github.com/kospex/kospex/blob/main/CHANGELOG.md"

[tool.ruff]
# Enable these rule categories
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]

# Ignore F401 (unused imports), F541 (f-string without placeholders), E501 (Line too long)
# Ignore I001 (Import block is un-sorted or unformatted), N812  (Lowercase `x_y` imported as non-lowercase `X_Y`
# These will only show as warnings, not fail the build
ignore = ["F401", "F541", "E501", "I001" ,"N812"]

# Exclude common directories
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "venv",
]

line-length = 100
