# Accepted findings for the Trivy gate in build-image.sh.
#
# Each entry is matched by package URL, so it covers exactly the vulnerable
# version named here and nothing else: a different version, or the same
# advisory in another package, still fails the gate. Every entry expires, and
# an expired entry stops applying, so the gate fails again and forces a fresh
# look -- nothing here can outlive the reason it was added.
#
# Only the gate uses this file. The informational scan before it still lists
# these findings, so they stay visible in every build.
#
# Both findings are in a copy of setuptools that pip bundles inside itself
# (pip/_vendor/). It is not a separate install, so upgrading setuptools in the
# environment does not change it; only a pip release that
# re-vendors does. This image gets pip from `pip install --upgrade pip`, and a
# kospex install also gets pip, because sqlite-utils 4.x requires it.
# kospex never runs pip.
#
# pip 26.3 re-vendored msgpack 1.2.4, which fixes GHSA-6v7p-g79w-8964, so that
# entry was removed. It still vendors setuptools 70.3.0, as does pip's main
# branch. Re-check when the next pip release ships, or before these entries
# expire: rebuild the image, delete any entry that no longer matches, and
# extend nothing without re-reading the reasoning.

vulnerabilities:
  # setuptools: path traversal in PackageIndex (setuptools/package_index.py).
  - id: CVE-2025-47273
    purls:
      - "pkg:pypi/setuptools@70.3.0"
    expired_at: 2026-12-31
    statement: >-
      pip 26.2.x and 26.3 bundle only pkg_resources/__init__.py from setuptools
      70.3.0, not the setuptools package, so setuptools.package_index is not present.
      pip's own pip/_internal/models/index.py PackageIndex is an unrelated
      class holding index URLs. pip's source still vendors 70.3.0.

  # setuptools: MANIFEST.in exclusion bypass in sdist (MEDIUM; listed so a gate
  # run with TRIVY_GATE_SEVERITY including MEDIUM behaves the same way).
  - id: CVE-2026-59890
    purls:
      - "pkg:pypi/setuptools@70.3.0"
    expired_at: 2026-12-31
    statement: >-
      Same bundled pkg_resources as above. The flaw is in setuptools' sdist
      file list, which pip does not bundle and never runs from its vendored
      copy.
