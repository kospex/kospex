# Accepted findings for the Trivy gate in build-image.sh.
#
# Each entry is matched by package URL, so it covers exactly the vulnerable
# version named here and nothing else: a different version, or the same
# advisory in another package, still fails the gate. Every entry expires, and
# an expired entry stops applying, so the gate fails again and forces a fresh
# look -- nothing here can outlive the reason it was added.
#
# Only the gate uses this file. The informational scan before it still lists
# these findings, so they stay visible in every build.
#
# All three findings are in copies of other packages that pip bundles inside
# itself (pip/_vendor/). They are not separate installs, so upgrading msgpack or
# setuptools in the environment does not change them; only a pip release that
# re-vendors does. This image gets pip from `pip install --upgrade pip`, and a
# kospex install also gets pip, because sqlite-utils 4.x requires it.
# kospex never runs pip.
#
# Re-check when pip 26.3 is released (expected around October 2026): rebuild
# the image, delete any entry that no longer matches, and extend nothing
# without re-reading the reasoning.

vulnerabilities:
  # msgpack: Unpacker reuse after a caught error can read out of bounds and
  # crash (DoS). Fixed in msgpack 1.2.1. pip's source already vendors 1.2.1
  # (pypa/pip c75edb6a4, 2026-08-03), but no pip release includes it yet --
  # pip 26.2.1 still ships 1.1.2.
  - id: GHSA-6v7p-g79w-8964
    purls:
      - "pkg:pypi/msgpack@1.1.2"
    expired_at: 2026-11-30
    statement: >-
      Bundled in pip 26.2.1 (pip/_vendor/msgpack). pip calls only one-shot
      msgpack.dumps() and msgpack.loads(), in its HTTP cache
      (cachecontrol/serialize.py), and never reuses a streaming Unpacker, which
      is what the advisory needs. No released pip bundles a fixed msgpack yet.

  # setuptools: path traversal in PackageIndex (setuptools/package_index.py).
  - id: CVE-2025-47273
    purls:
      - "pkg:pypi/setuptools@70.3.0"
    expired_at: 2026-11-30
    statement: >-
      pip 26.2.1 bundles only pkg_resources/__init__.py from setuptools 70.3.0,
      not the setuptools package, so setuptools.package_index is not present.
      pip's own pip/_internal/models/index.py PackageIndex is an unrelated
      class holding index URLs. pip's source still vendors 70.3.0.

  # setuptools: MANIFEST.in exclusion bypass in sdist (MEDIUM; listed so a gate
  # run with TRIVY_GATE_SEVERITY including MEDIUM behaves the same way).
  - id: CVE-2026-59890
    purls:
      - "pkg:pypi/setuptools@70.3.0"
    expired_at: 2026-11-30
    statement: >-
      Same bundled pkg_resources as above. The flaw is in setuptools' sdist
      file list, which pip does not bundle and never runs from its vendored
      copy.
